server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /health { access_log off; return 200 'ok'; }
  location = /remoteEntry.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /mf-manifest.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
