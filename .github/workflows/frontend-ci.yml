name: Frontend CI
on:
  pull_request:
  push:
    branches: [develop, staging, master, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [shell, academic, learning, public]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP=${{ matrix.app }} -t vq-${{ matrix.app }}:ci .
